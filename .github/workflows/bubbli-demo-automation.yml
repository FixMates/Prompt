name: Bubbli demo automation validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation/bubbli-demo/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check automation/bubbli-demo/run.mjs
